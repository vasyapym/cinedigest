# The daily digest run: fetch all six venues, write the snapshot, the page and the digest.
#
# cron "17 3/4/5 * * *" = 06:17/07:17/08:17 MSK (UTC+3): three wake-ups a morning, all
# deliberately off the top of the hour — GitHub Actions throttles schedules that fire
# on :00 and can silently skip them (observed 2026-11-06: the 06:00 retrieval never
# registered at all). The first successful run of the day clears the stale-page banner;
# the later ones refresh data. Owner asked for the triple.
# The run exits 0 when every venue is ok, 2 when any venue failed (degraded,
# incl. stale data carried over). A degraded run still commits docs/ (the page
# must publish the honest banner), uploads the raw snapshots/ artifact for
# debugging, and then fails the workflow so GitHub sends the owners a notice.
#
# The `--out` root is the repo root: the outputs land in docs/ (committed and
# served by GitHub Pages from the /docs folder) and the raw bodies in snapshots/
# (gitignored, uploaded as an artifact only on degradation).
name: digest

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 4 * * *"
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the digest
        id: run
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python -m cinedigest run --out .
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit docs/ when changed
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            git config user.name "digest-bot"
            git config user.email "digest-bot@users.noreply.github.com"
            git add docs/
            git commit -m "digest: $(TZ=Europe/Moscow date '+%Y-%m-%d %H:%M %Z')"
            git push origin HEAD:main
          else
            echo "docs/ unchanged"
          fi

      - name: Upload raw snapshots (degraded runs only)
        if: steps.run.outputs.code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots
          retention-days: 14

      - name: Fail the workflow when a venue failed
        if: steps.run.outputs.code != '0'
        run: |
          echo "degraded run: at least one venue failed (cinedigest exit code ${{ steps.run.outputs.code }})"
          exit 1
